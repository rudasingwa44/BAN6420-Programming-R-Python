<!DOCTYPE html>
<html>
<head>
    <title>Income & Spending Survey</title>
</head>
<body>
    <h1>Income & Spending Survey</h1>

    <form method="POST">
        <label>Age:</label>
        <input type="number" name="age" required><br><br>

        <label>Gender:</label>
        <select name="gender" required>
            <option value="">-- choose --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select><br><br>

        <label>Total Income:</label>
        <input type="number" name="total_income" required><br><br>

        <h3>Expenses (tick and enter amount)</h3>

        <input type="checkbox" name="expense" value="utilities"> Utilities
        <input type="number" name="utilities_amount"><br>

        <input type="checkbox" name="expense" value="entertainment"> Entertainment
        <input type="number" name="entertainment_amount"><br>

        <input type="checkbox" name="expense" value="school_fees"> School Fees
        <input type="number" name="school_fees_amount"><br>

        <input type="checkbox" name="expense" value="shopping"> Shopping
        <input type="number" name="shopping_amount"><br>

        <input type="checkbox" name="expense" value="healthcare"> Healthcare
        <input type="number" name="healthcare_amount"><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
